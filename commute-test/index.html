<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="부산교통">
<title>부산 교통</title><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}html{background:#08111f}body{margin:0;background:#08111f;color:#f7f9fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;min-height:100vh}.app{max-width:820px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h1{font-size:23px;margin:0}.sub{color:#9db0c8;font-size:13px;margin-top:5px}.panel{display:none}.panel.active{display:block}.top,.card,.viewer,.install{background:#101a2e;border:1px solid #ffffff12;border-radius:17px}.top{padding:14px;margin-bottom:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.origin{font-weight:850;font-size:16px}.muted{color:#94a6bc;font-size:12px;margin-top:4px}.refresh,.button{border:0;background:#2d7ff9;color:#fff;border-radius:12px;padding:11px 14px;font-weight:850;cursor:pointer;text-decoration:none}.refresh:disabled,.calc:disabled{opacity:.55}.cards{display:grid;gap:10px}.card{padding:15px}.tag{font-size:11px;font-weight:900;color:#9bcaff}.name{font-size:18px;font-weight:900;margin:5px 0 2px}.addr{color:#9fb0c5;font-size:12px}.metrics{display:flex;gap:10px;margin-top:13px}.metric{flex:1;background:#0b1424;border-radius:12px;padding:11px}.big{font-size:23px;font-weight:950}.label{font-size:11px;color:#91a1b7;margin-top:3px}.actions{display:flex;gap:8px;margin-top:12px}.actions button,.actions a{flex:1;text-align:center;text-decoration:none;border:0;border-radius:11px;padding:10px 8px;font-size:13px;font-weight:850}.calc{background:#1c2c49;color:#fff}.map{background:#152033;color:#bcdcff}.status{font-size:12px;margin-top:9px;color:#ffcb72;min-height:18px}.ok{color:#72dfa0}.err{color:#ff8f8f}.viewer{overflow:hidden;background:#000}.ratio{aspect-ratio:16/9;position:relative}.ratio iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.viewerbar{background:#111b2d;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.camgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.cam{min-height:58px;text-align:left;border:1px solid #ffffff18;border-radius:12px;background:#101a2e;color:white;padding:11px;font-weight:800}.cam.active{outline:2px solid #54a8ff;background:#16345b}.section-title{font-size:14px;color:#9bcaff;margin:18px 2px 9px;font-weight:900}.cctv-list{display:grid;gap:9px}.cctv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px}.cctv strong{display:block;font-size:15px}.cctv small{display:block;color:#91a1b7;margin-top:4px}.cctv a{white-space:nowrap;background:#214b75;color:#fff;border-radius:10px;padding:9px 11px;text-decoration:none;font-size:12px;font-weight:850}.note{color:#ffcb72!important}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(820px,100%);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#0a1323ee;backdrop-filter:blur(14px);border-top:1px solid #ffffff18;z-index:5}.nav button{border:0;background:transparent;color:#8496ad;padding:8px 4px;font-size:11px;font-weight:850}.nav span{display:block;font-size:21px;margin-bottom:2px}.nav button.active{color:#6db2ff}.install{display:none;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:12px}.install.show{display:flex}.install p{margin:0;font-size:12px;line-height:1.4}.install button{border:0;border-radius:10px;padding:9px 11px;background:#2d7ff9;color:#fff;font-weight:850}.foot{color:#7f91a9;font-size:11px;line-height:1.5;margin-top:14px;text-align:center}@media(min-width:700px){.cards{grid-template-columns:repeat(3,1fr)}.metrics{display:block}.metric{margin-top:7px}.camgrid{grid-template-columns:repeat(5,1fr)}.cctv-list{grid-template-columns:1fr 1fr}}@media(display-mode:standalone){.install{display:none!important}}
</style></head>
<body><main class="app">
<div id="installBox" class="install"><p><b>홈 화면에 설치</b><br>아이콘 하나로 세 가지 교통 화면을 실행하세요.</p><button id="installBtn">설치</button></div>
<header class="head"><div><h1 id="pageTitle">🚗 출퇴근 시간</h1><div class="sub" id="pageSub">현재 교통 기준 예상시간과 거리</div></div></header>
<section class="panel active" id="commutePanel"><section class="top"><div class="row"><div><div class="origin">🏠 오륙도SK뷰아파트</div><div class="muted">출발지 · 부산 남구 오륙도SK뷰아파트</div></div><button class="refresh" id="refresh" type="button">전체 갱신</button></div></section><section class="cards" id="cards"></section><div class="foot">카카오 주소검색·자동차 길찾기 사용 · API 키는 서버에만 보관됩니다.</div></section>
<section class="panel" id="bridgePanel"><section class="viewer"><div class="ratio"><iframe id="player" title="광안대교 CCTV" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div><div class="viewerbar"><b id="camName">하부 롯데아파트</b><div class="actions" style="margin:0"><button class="calc" id="videoReload">새로고침</button><a class="map" id="youtubeLink" target="_blank" rel="noopener">YouTube</a></div></div></section><div class="camgrid" id="camGrid"></div><div class="foot">광안대교 공식 실시간 YouTube 방송 · 영상은 음소거 상태로 시작합니다.</div></section>
<section class="panel" id="trafficPanel"><div class="muted" style="margin-bottom:12px">버튼을 누르면 제공기관의 실시간 CCTV 화면이 열립니다.</div><div id="cctvGroups"></div><div class="foot">UTIC·낙동강홍수통제소 제공 화면입니다. 기관 사정에 따라 영상이 일시 중단될 수 있습니다.</div></section>
</main>
<nav class="nav" aria-label="주요 화면"><button class="active" data-tab="commute"><span>🚗</span>출퇴근</button><button data-tab="bridge"><span>🌉</span>광안대교</button><button data-tab="traffic"><span>📹</span>교통 CCTV</button></nav>
<script src="./config.js"></script><script>
const apiUrl=(window.COMMUTE_API_URL||'').replace(/\/$/,'');
const places=[{id:'oncheon',tag:'출근',name:'온천천공원길 38-4',address:'부산 온천천공원길 38-4'},{id:'millak',tag:'자주 가는 곳',name:'민락동 36-3',address:'부산 수영구 민락동 36-3'},{id:'jwadong',tag:'자주 가는 곳',name:'벽산1차 104동',address:'부산 해운대구 좌동 벽산1차아파트 104동'}];
const cards=document.getElementById('cards'),esc=encodeURIComponent;
places.forEach((p,i)=>{const e=document.createElement('article');e.className='card';e.innerHTML=`<div class="tag">${p.tag}</div><div class="name">${p.name}</div><div class="addr">${p.address}</div><div class="metrics"><div class="metric"><div class="big" id="time${i}">--분</div><div class="label">현재 예상시간</div></div><div class="metric"><div class="big" id="dist${i}">--km</div><div class="label">예상 거리</div></div></div><div class="status" id="status${i}">갱신 대기</div><div class="actions"><button class="calc" id="calc${i}">다시 계산</button><a class="map" target="_blank" rel="noopener" href="https://map.kakao.com/link/to/${esc(p.name)},${esc(p.address)}">카카오맵</a></div>`;cards.appendChild(e);document.getElementById('calc'+i).onclick=()=>calcOne(i)});
async function calcOne(i){const st=document.getElementById('status'+i),button=document.getElementById('calc'+i);button.disabled=true;st.textContent='현재 교통정보 계산 중…';try{const r=await fetch(apiUrl+'/route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({destinationId:places[i].id})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'서버 요청 실패');document.getElementById('time'+i).textContent=Math.round(d.durationSeconds/60)+'분';document.getElementById('dist'+i).textContent=(d.distanceMeters/1000).toFixed(1)+'km';st.innerHTML='<span class="ok">● '+new Date(d.updatedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' 갱신</span>'}catch(e){st.innerHTML='<span class="err">'+e.message+'</span>'}finally{button.disabled=false}}
async function calcAll(){const b=document.getElementById('refresh');b.disabled=true;await Promise.all(places.map((_,i)=>calcOne(i)));b.disabled=false}document.getElementById('refresh').onclick=calcAll;
const cams=[['하부 롯데아파트','FJlxNUM-AXQ'],['하부 용호동','5-BhCOQ4f4s'],['상부 용호동','ufRTT1XhcSs'],['상부 현수중앙','OhXqC3pDBaU'],['상부','FbaiWK-0MsI']];let currentCam=Number(localStorage.getItem('busanCam'))||0;const player=document.getElementById('player'),camName=document.getElementById('camName'),camGrid=document.getElementById('camGrid'),youtubeLink=document.getElementById('youtubeLink');
function selectCam(i){currentCam=i;camName.textContent=cams[i][0];player.src='https://www.youtube-nocookie.com/embed/'+cams[i][1]+'?autoplay=1&mute=1&playsinline=1&rel=0';youtubeLink.href='https://www.youtube.com/watch?v='+cams[i][1];document.querySelectorAll('.cam').forEach((b,j)=>b.classList.toggle('active',i===j));localStorage.setItem('busanCam',i)}cams.forEach((c,i)=>{const b=document.createElement('button');b.className='cam';b.textContent=c[0];b.onclick=()=>selectCam(i);camGrid.appendChild(b)});document.getElementById('videoReload').onclick=()=>selectCam(currentCam);selectCam(Math.min(currentCam,cams.length-1));
const cctvs=[
['연제·과정교','연제구 과정교로 인근','https://www.utic.go.kr/jsp/map/cctvStream.jsp?cctvid=E930385&kind=bs&id=00-800-0146'],['연제·과정교','과정교차로','https://www.utic.go.kr/jsp/map/cctvStream.jsp?cctvid=L230293&kind=I&id=cctv_63'],['연제·과정교','연산교차로','https://www.utic.go.kr/jsp/map/cctvStream.jsp?cctvid=L230086&kind=I&id=cctv_17'],['연제·과정교','토곡사거리','https://www.utic.go.kr/jsp/map/cctvStream.jsp?cctvid=L230141&kind=I&id=cctv_62'],
['광안·센텀','광안대교에서 마린시티 진출입로','https://www.utic.go.kr/jsp/map/cctvStream.jsp?cctvid=L230165&kind=I&id=cctv_175'],['광안·센텀','올림픽동산삼거리','https://www.utic.go.kr/jsp/map/cctvStream.jsp?cctvid=L230055&kind=I&id=cctv_89'],['광안·센텀','센텀이편한','https://www.utic.go.kr/jsp/map/cctvStream.jsp?cctvid=L230039&kind=I&id=cctv_625'],['광안·센텀','수영4호교','https://www.utic.go.kr/jsp/map/cctvStream.jsp?cctvid=L230039&kind=I&id=cctv_625','센텀이편한과 같은 링크'],['광안·센텀','광안대교 내려와서 · 센텀입구','https://www.utic.go.kr/jsp/map/cctvStream.jsp?cctvid=L230205&kind=I&id=2026-EC-01-041'],['광안·센텀','수영1호교사거리','https://www.utic.go.kr/jsp/map/cctvStream.jsp?cctvid=L230198&kind=I&id=2026-EC-03-009'],['기타','세병교','https://www.nakdongriver.go.kr/sumun/popup/cctvView.do?Obscd=199056']];
const groups=document.getElementById('cctvGroups');[...new Set(cctvs.map(c=>c[0]))].forEach(group=>{const title=document.createElement('div');title.className='section-title';title.textContent=group;groups.appendChild(title);const list=document.createElement('div');list.className='cctv-list';cctvs.filter(c=>c[0]===group).forEach(c=>{const e=document.createElement('article');e.className='card cctv';e.innerHTML=`<div><strong>${c[1]}</strong><small class="${c[3]?'note':''}">${c[3]||'실시간 교통 CCTV'}</small></div><a href="${c[2]}" target="_blank" rel="noopener">영상 열기</a>`;list.appendChild(e)});groups.appendChild(list)});
const tabInfo={commute:['🚗 출퇴근 시간','현재 교통 기준 예상시간과 거리'],bridge:['🌉 광안대교 CCTV','실시간 교통 영상 5개'],traffic:['📹 자주 보는 CCTV','주요 이동 경로 실시간 화면']};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.tab+'Panel').classList.add('active');document.getElementById('pageTitle').textContent=tabInfo[b.dataset.tab][0];document.getElementById('pageSub').textContent=tabInfo[b.dataset.tab][1];localStorage.setItem('busanTab',b.dataset.tab);scrollTo(0,0)});const savedTab=localStorage.getItem('busanTab');if(savedTab)document.querySelector(`.nav button[data-tab="${savedTab}"]`)?.click();
let deferredPrompt=null;const installBox=document.getElementById('installBox');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBox.classList.add('show')});document.getElementById('installBtn').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBox.classList.remove('show')}else alert('브라우저 메뉴에서 “홈 화면에 추가”를 눌러주세요.')};window.addEventListener('appinstalled',()=>installBox.classList.remove('show'));if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));setTimeout(calcAll,300);
</script></body></html>
