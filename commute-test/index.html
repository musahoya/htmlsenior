<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <title>부산 출퇴근</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#08111f;color:#f7f9fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.app{max-width:760px;margin:auto;padding:18px 14px 36px}h1{font-size:23px;margin:0}.sub{color:#9db0c8;font-size:13px;margin:6px 0 16px}.top,.card{background:#101a2e;border:1px solid #ffffff12;border-radius:17px}.top{padding:14px;margin-bottom:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.origin{font-weight:850;font-size:16px}.muted{color:#94a6bc;font-size:12px;margin-top:4px}.refresh{border:0;background:#2d7ff9;color:#fff;border-radius:12px;padding:11px 14px;font-weight:850;cursor:pointer}.refresh:disabled,.calc:disabled{opacity:.55;cursor:wait}.cards{display:grid;gap:10px}.card{padding:15px}.tag{font-size:11px;font-weight:900;color:#9bcaff}.name{font-size:18px;font-weight:900;margin:5px 0 2px}.addr{color:#9fb0c5;font-size:12px}.metrics{display:flex;gap:10px;margin-top:13px}.metric{flex:1;background:#0b1424;border-radius:12px;padding:11px}.big{font-size:23px;font-weight:950}.label{font-size:11px;color:#91a1b7;margin-top:3px}.actions{display:flex;gap:8px;margin-top:12px}.actions button,.actions a{flex:1;text-align:center;text-decoration:none;border:0;border-radius:11px;padding:10px 8px;font-size:13px;font-weight:850}.calc{background:#1c2c49;color:#fff;cursor:pointer}.map{background:#152033;color:#bcdcff}.status{font-size:12px;margin-top:9px;color:#ffcb72;min-height:18px}.foot{color:#7f91a9;font-size:11px;line-height:1.55;margin-top:14px;text-align:center}.ok{color:#72dfa0}.err{color:#ff8f8f}@media(min-width:700px){.cards{grid-template-columns:repeat(3,1fr)}.metrics{display:block}.metric{margin-top:7px}}
  </style>
</head>
<body>
<main class="app">
  <h1>🚗 부산 출퇴근</h1>
  <div class="sub">오륙도SK뷰에서 자주 가는 곳까지 현재 교통 기준 예상시간</div>
  <section class="top"><div class="row"><div><div class="origin">🏠 오륙도SK뷰아파트</div><div class="muted">출발지 · 부산 남구 오륙도SK뷰아파트</div></div><button class="refresh" id="refresh" type="button">전체 갱신</button></div></section>
  <section class="cards" id="cards"></section>
  <div class="foot">카카오 주소검색·자동차 길찾기 사용 · API 키는 서버에만 안전하게 보관됩니다.</div>
</main>
<script src="./config.js"></script>
<script>
const apiUrl=(window.COMMUTE_API_URL||'').replace(/\/$/,'');
const origin={name:'오륙도SK뷰아파트',address:'부산 남구 오륙도SK뷰아파트'};
const places=[
  {id:'oncheon',tag:'출근',name:'온천천공원길 38-4',address:'부산 온천천공원길 38-4'},
  {id:'millak',tag:'자주 가는 곳',name:'민락동 36-3',address:'부산 수영구 민락동 36-3'},
  {id:'jwadong',tag:'자주 가는 곳',name:'벽산1차 104동',address:'부산 해운대구 좌동 벽산1차아파트 104동'}
];
const cards=document.getElementById('cards');
const esc=encodeURIComponent;
places.forEach((p,i)=>{const e=document.createElement('article');e.className='card';e.innerHTML=`<div class="tag">${p.tag}</div><div class="name">${p.name}</div><div class="addr">${p.address}</div><div class="metrics"><div class="metric"><div class="big" id="time${i}">--분</div><div class="label">현재 예상시간</div></div><div class="metric"><div class="big" id="dist${i}">--km</div><div class="label">예상 거리</div></div></div><div class="status" id="status${i}">갱신 대기</div><div class="actions"><button class="calc" id="calc${i}" type="button">다시 계산</button><a class="map" target="_blank" rel="noopener" href="https://map.kakao.com/link/to/${esc(p.name)},${esc(p.address)}">카카오맵 열기</a></div>`;cards.appendChild(e);document.getElementById('calc'+i).addEventListener('click',()=>calcOne(i))});
function setBusy(i,busy){document.getElementById('calc'+i).disabled=busy}
async function calcOne(i){const st=document.getElementById('status'+i);if(!apiUrl||apiUrl.includes('YOUR-WORKER')){st.innerHTML='<span class="err">서버 주소 설정이 필요합니다.</span>';return}setBusy(i,true);st.textContent='현재 교통정보 계산 중…';try{const r=await fetch(apiUrl+'/route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({destinationId:places[i].id})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'서버 요청 실패 ('+r.status+')');document.getElementById('time'+i).textContent=Math.round(data.durationSeconds/60)+'분';document.getElementById('dist'+i).textContent=(data.distanceMeters/1000).toFixed(1)+'km';const updated=new Date(data.updatedAt);st.innerHTML='<span class="ok">● '+updated.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' 갱신</span>'}catch(e){st.innerHTML='<span class="err">'+e.message+'</span>'}finally{setBusy(i,false)}}
async function calcAll(){const button=document.getElementById('refresh');button.disabled=true;await Promise.all(places.map((_,i)=>calcOne(i)));button.disabled=false}
document.getElementById('refresh').addEventListener('click',calcAll);
setTimeout(calcAll,300);
</script>
</body>
</html>
