<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>부산 출퇴근 테스트</title><style>*{box-sizing:border-box}body{margin:0;background:#08111f;color:#f7f9fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.app{max-width:760px;margin:auto;padding:18px 14px 36px}h1{font-size:23px;margin:0}.sub{color:#9db0c8;font-size:13px;margin:6px 0 16px}.top,.card,.settings{background:#101a2e;border:1px solid #ffffff12;border-radius:17px}.top{padding:14px;margin-bottom:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.origin{font-weight:850;font-size:16px}.muted{color:#94a6bc;font-size:12px;margin-top:4px}.refresh{border:0;background:#2d7ff9;color:#fff;border-radius:12px;padding:11px 14px;font-weight:850}.cards{display:grid;gap:10px}.card{padding:15px}.tag{font-size:11px;font-weight:900;color:#9bcaff}.name{font-size:18px;font-weight:900;margin:5px 0 2px}.addr{color:#9fb0c5;font-size:12px}.metrics{display:flex;gap:10px;margin-top:13px}.metric{flex:1;background:#0b1424;border-radius:12px;padding:11px}.big{font-size:23px;font-weight:950}.label{font-size:11px;color:#91a1b7;margin-top:3px}.actions{display:flex;gap:8px;margin-top:12px}.actions button,.actions a{flex:1;text-align:center;text-decoration:none;border:0;border-radius:11px;padding:10px 8px;font-size:13px;font-weight:850}.calc{background:#1c2c49;color:#fff}.map{background:#152033;color:#bcdcff}.status{font-size:12px;margin-top:9px;color:#ffcb72}.settings{margin-top:14px;padding:14px}.settings summary{cursor:pointer;font-weight:850}.settings input{width:100%;margin-top:10px;background:#091321;color:white;border:1px solid #ffffff20;border-radius:10px;padding:11px;font-size:14px}.settings .save{margin-top:9px;width:100%;border:0;border-radius:10px;padding:10px;background:#254872;color:white;font-weight:850}.foot{color:#7f91a9;font-size:11px;line-height:1.55;margin-top:14px;text-align:center}.ok{color:#72dfa0}.err{color:#ff8f8f}@media(min-width:700px){.cards{grid-template-columns:repeat(3,1fr)}.metrics{display:block}.metric{margin-top:7px}}</style></head><body><main class="app"><h1>🚗 부산 출퇴근</h1><div class="sub">오륙도SK뷰에서 자주 가는 곳까지 현재 교통 기준 예상시간</div><section class="top"><div class="row"><div><div class="origin">🏠 오륙도SK뷰아파트</div><div class="muted">출발지 · 부산 남구 오륙도SK뷰</div></div><button class="refresh" onclick="calcAll()">전체 갱신</button></div></section><section class="cards" id="cards"></section><details class="settings"><summary>⚙️ 카카오 API 연결</summary><div class="muted" style="margin-top:8px">카카오 Developers의 REST API 키를 한 번 입력하면 이 휴대폰에만 저장합니다. GitHub에는 저장하지 않습니다.</div><input id="key" type="password" placeholder="Kakao REST API Key"><button class="save" onclick="saveKey()">키 저장 후 실시간 계산</button><div id="keymsg" class="muted"></div></details><div class="foot">테스트 버전 · 카카오 주소검색 + 자동차 길찾기 API 사용. 브라우저에서 API 호출이 차단되는 경우 다음 버전은 서버리스 프록시 방식으로 바꾸면 됩니다.</div></main><script>
const origin={name:'오륙도SK뷰아파트',address:'부산 오륙도SK뷰아파트'};
const places=[{tag:'출근',name:'온천천공원길 38-4',address:'부산 온천천공원길 38-4'},{tag:'자주 가는 곳',name:'민락동 36-3',address:'부산 수영구 민락동 36-3'},{tag:'자주 가는 곳',name:'벽산1차 104동',address:'부산 해운대구 좌동 벽산1차아파트 104동'}];
const cards=document.getElementById('cards');
function esc(s){return encodeURIComponent(s)}
places.forEach((p,i)=>{const e=document.createElement('article');e.className='card';e.innerHTML=`<div class="tag">${p.tag}</div><div class="name">${p.name}</div><div class="addr">${p.address}</div><div class="metrics"><div class="metric"><div class="big" id="time${i}">--분</div><div class="label">현재 예상시간</div></div><div class="metric"><div class="big" id="dist${i}">--km</div><div class="label">예상 거리</div></div></div><div class="status" id="status${i}">API 연결 전</div><div class="actions"><button class="calc" onclick="calcOne(${i})">지금 계산</button><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=${esc(origin.address)}&destination=${esc(p.address)}&travelmode=driving">길찾기 열기</a></div>`;cards.appendChild(e)});
document.getElementById('key').value=localStorage.getItem('kakaoRestKey')||'';
function saveKey(){const k=document.getElementById('key').value.trim();if(!k)return;localStorage.setItem('kakaoRestKey',k);document.getElementById('keymsg').textContent='저장했습니다. 계산 중…';calcAll()}
async function geo(q,key){let r=await fetch('https://dapi.kakao.com/v2/local/search/address.json?query='+encodeURIComponent(q),{headers:{Authorization:'KakaoAK '+key}});if(!r.ok){r=await fetch('https://dapi.kakao.com/v2/local/search/keyword.json?query='+encodeURIComponent(q),{headers:{Authorization:'KakaoAK '+key}})}if(!r.ok)throw new Error('주소 검색 실패 '+r.status);const j=await r.json();if(!j.documents?.length)throw new Error('주소를 찾지 못함');return {x:j.documents[0].x,y:j.documents[0].y}}
async function route(a,b,key){const u=new URL('https://apis-navi.kakaomobility.com/v1/directions');u.searchParams.set('origin',a.x+','+a.y);u.searchParams.set('destination',b.x+','+b.y);u.searchParams.set('priority','RECOMMEND');u.searchParams.set('summary','true');const r=await fetch(u,{headers:{Authorization:'KakaoAK '+key}});if(!r.ok)throw new Error('길찾기 실패 '+r.status);const j=await r.json();const s=j.routes?.[0]?.summary;if(!s)throw new Error(j.routes?.[0]?.result_msg||'경로 없음');return s}
let originCoord=null;async function calcOne(i){const key=localStorage.getItem('kakaoRestKey');const st=document.getElementById('status'+i);if(!key){st.innerHTML='<span class="err">아래에서 카카오 REST API 키를 먼저 입력하세요.</span>';document.querySelector('.settings').open=true;return}st.textContent='현재 교통정보 계산 중…';try{if(!originCoord)originCoord=await geo(origin.address,key);const d=await geo(places[i].address,key);const s=await route(originCoord,d,key);document.getElementById('time'+i).textContent=Math.round(s.duration/60)+'분';document.getElementById('dist'+i).textContent=(s.distance/1000).toFixed(1)+'km';st.innerHTML='<span class="ok">● 방금 갱신</span>'}catch(e){st.innerHTML='<span class="err">'+e.message+' · 브라우저 API 제한일 수 있습니다.</span>'}}
async function calcAll(){for(let i=0;i<places.length;i++)await calcOne(i)}
if(localStorage.getItem('kakaoRestKey'))setTimeout(calcAll,300);
</script></body></html>
