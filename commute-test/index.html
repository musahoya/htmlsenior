.modal{position:fixed;inset:0;background:#000c;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{width:min(520px,100%);background:#101a2e;border:1px solid #ffffff18;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 12px;font-size:17px}.sheet label{display:block;font-size:12px;color:#9db0c8;margin:10px 0 5px}.sheet input{width:100%;background:#0b1424;border:1px solid #ffffff22;border-radius:11px;padding:12px;color:#fff;font-size:16px}.sheet .btns{display:flex;gap:8px;margin-top:16px}.sheet .btns button{flex:1;border:0;border-radius:11px;padding:12px;font-weight:850;font-size:14px;color:#fff;background:#1c2c49}.sheet .btns .primary{background:#2d7ff9}.sheet .btns .danger{background:#5a2330;flex:0 0 auto}.sheet .help{font-size:12px;color:#7f91a9;margin-top:10px;line-height:1.5}

.metrics.two{gap:8px}.metrics.two .metric{min-width:0;padding:11px 10px}.metrics.two .from{font-size:12px;font-weight:850;color:#9bcaff;margin-bottom:5px}.metrics.two .big{font-size:23px}.metrics.two .dist{font-size:12px;color:#9fb0c5;margin-top:3px}.metrics.two .ms{font-size:11px;margin-top:6px;min-height:14px;color:#ffcb72;word-break:keep-all}

<body><main class="app">
<div id="installBox" class="install"><p><b>홈 화면에 설치</b><br>아이콘 하나로 세 가지 교통 화면을 실행하세요.</p><button id="installBtn">설치</button></div>
<header class="head"><div><h1 id="pageTitle">🚗 출퇴근 시간</h1><div class="sub" id="pageSub">현재 교통 기준 예상시간과 거리</div></div></header>
<section class="panel active" id="commutePanel"><section class="top"><div class="row" style="margin-bottom:10px"><div class="origin">출발지</div><button class="refresh" id="refresh" type="button">전체 갱신</button></div><div class="originlist" id="originList"></div></section><section class="cards" id="cards"></section><button class="addplace" id="addPlace" type="button">＋ 장소 추가</button><div class="foot">카카오 주소검색·자동차 길찾기 사용 · 장소는 이 기기에 저장됩니다.</div></section>
<section class="panel" id="bridgePanel"><section class="viewer"><div class="ratio"><iframe id="player" title="광안대교 CCTV" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div><div class="viewerbar"><b id="camName">하부 롯데아파트</b><div class="actions" style="margin:0"><button class="calc" id="videoReload">새로고침</button><a class="map" id="youtubeLink" target="_blank" rel="noopener">YouTube</a></div></div></section><div class="camgrid" id="camGrid"></div><div class="foot">광안대교 공식 실시간 YouTube 방송 · 영상은 음소거 상태로 시작합니다.</div></section>
<section class="panel" id="trafficPanel"><section class="viewer"><div class="ratio"><video id="cv" class="vid" muted playsinline autoplay controls></video><div id="cmsg" class="vmsg" hidden></div></div><div class="viewerbar"><b id="cname"></b><div class="actions" style="margin:0"><button class="calc" id="creload" type="button">새로고침</button><button class="calc" id="cfull" type="button">전체화면</button></div></div></section><div class="cctvgrid" id="cctvGrid"></div><div class="section-title">기타</div><div class="cctv-list"><article class="card cctv"><div><strong>세병교</strong><small>낙동강홍수통제소 CCTV</small></div><a href="https://www.nakdongriver.go.kr/sumun/popup/cctvView.do?Obscd=199056" target="_blank" rel="noopener">영상 열기</a></article></div><div class="foot">영상은 부산광역시 교통정보서비스센터 실시간 CCTV입니다.</div></section>
</main>
<div class="modal" id="modal"><form class="sheet" id="sheet"><h2 id="mTitle"></h2><label for="mName">이름 (화면에 표시)</label><input id="mName" maxlength="30" autocomplete="off"><label for="mAddr">주소 또는 장소명 (카카오 검색용)</label><input id="mAddr" maxlength="80" autocomplete="off" required><div class="help">예: 부산 해운대구 센텀시티역, 부산 수영구 광안해변로 219</div><div class="btns"><button type="button" class="danger" id="mDel">삭제</button><button type="button" id="mCancel">취소</button><button type="submit" class="primary">저장</button></div></form></div>
<nav class="nav" aria-label="주요 화면"><button class="active" data-tab="commute"><span>🚗</span>출퇴근</button><button data-tab="bridge"><span>🌉</span>광안대교</button><button data-tab="traffic"><span>📹</span>교통 CCTV</button></nav>
<script src="./config.js"></script><script src="./hls.min.js"></script><script>
const apiUrl=(window.COMMUTE_API_URL||'').replace(/\/$/,'');
const esc=encodeURIComponent;
const $=id=>document.getElementById(id);
const html=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ---------- 출퇴근 ---------- */
const OICON=['🏠','🏢'];
const DEFAULT_CFG={origins:[{name:'집',address:'부산 남구 오륙도SK뷰아파트'},{name:'사무실',address:''}],places:[{id:'oncheon',tag:'출근',name:'온천천공원길 38-4',address:'부산 온천천공원길 38-4'},{id:'millak',tag:'자주 가는 곳',name:'민락동 36-3',address:'부산 수영구 민락동 36-3'},{id:'jwadong',tag:'자주 가는 곳',name:'벽산1차 104동',address:'부산 해운대구 좌동 벽산1차아파트 104동'}]};
function loadCfg(){
  try{
    const c=JSON.parse(localStorage.getItem('commuteCfg')||'null');
    if(c&&Array.isArray(c.places)){
      if(Array.isArray(c.origins)&&c.origins.length>=2)return c;
      if(c.origin)return{origins:[{name:'집',address:c.origin.address},{name:'사무실',address:''}],places:c.places}; // 예전 저장 형식(출발지 1개)
    }
  }catch{}
  return JSON.parse(JSON.stringify(DEFAULT_CFG));
}
function saveCfg(){try{localStorage.setItem('commuteCfg',JSON.stringify(cfg))}catch{}}
let cfg=loadCfg();const results={};
const rkey=(p,o)=>p.id+'#'+o;
function renderOrigin(){
  const box=$('originList');box.innerHTML='';
  cfg.origins.forEach((o,k)=>{
    const d=document.createElement('div');d.className='orow';
    d.innerHTML=`<div style="min-width:0"><div class="oname">${OICON[k]} ${html(o.name)}</div><div class="oaddr${o.address?'':' empty'}">${o.address?html(o.address):'주소를 입력하면 시간이 계산됩니다'}</div></div><button class="origin-btn" id="oedit${k}" type="button">${o.address?'변경':'설정'}</button>`;
    box.appendChild(d);
    $('oedit'+k).onclick=()=>openModal({title:o.name+' 주소 설정',name:o.name,addr:o.address,canDelete:false,onSave:(n,a)=>{cfg.origins[k]={name:n,address:a};for(const x in results)if(x.endsWith('#'+k))delete results[x];saveCfg();renderOrigin();renderCards();calcAll()}});
  });
}
function metricHtml(p,i,k){
  const o=cfg.origins[k],r=results[rkey(p,k)]||{};
  const ms=!o.address?'출발지를 설정하세요':(r.ms||'갱신 대기');
  return `<div class="metric"><div class="from">${OICON[k]} ${html(o.name)}에서</div><div class="big" id="time${i}_${k}">${r.time||'--분'}</div><div class="dist" id="dist${i}_${k}">${r.dist||'--km'}</div><div class="ms" id="ms${i}_${k}">${ms}</div></div>`;
}
function renderCards(){
  const cards=$('cards');cards.innerHTML='';
  cfg.places.forEach((p,i)=>{
    const e=document.createElement('article');e.className='card';
    e.innerHTML=`<div class="tag">${html(p.tag||(i===0?'출근':'자주 가는 곳'))}</div><div class="name">${html(p.name)}</div><div class="addr">${html(p.address)}</div><div class="metrics two">${metricHtml(p,i,0)}${metricHtml(p,i,1)}</div><div class="actions"><button class="calc" id="calc${i}" type="button">다시 계산</button><button class="edit" id="edit${i}" type="button">수정</button><a class="map" target="_blank" rel="noopener" href="https://map.kakao.com/link/to/${esc(p.name)},${esc(p.address)}">카카오맵</a></div>`;
    cards.appendChild(e);
    $('calc'+i).onclick=()=>calcOne(i);
    $('edit'+i).onclick=()=>openModal({title:'장소 수정',name:p.name,addr:p.address,canDelete:true,onSave:(n,a)=>{cfg.places[i]={id:'p'+Date.now(),tag:p.tag,name:n,address:a};saveCfg();renderCards();calcOne(i)},onDelete:()=>{cfg.places.splice(i,1);saveCfg();renderCards()}});
  });
}
async function calcRoute(i,k){
  const p=cfg.places[i],o=cfg.origins[k];if(!p)return;
  const put=(id,v)=>{const el=$(id);if(el)el.textContent=v};
  if(!o.address)return;
  put(`ms${i}_${k}`,'계산 중…');
  try{
    const body={destination:p.address,origin:o.address};
    if(DEFAULT_CFG.places.some(d=>d.id===p.id))body.destinationId=p.id;
    const r=await fetch(apiUrl+'/route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||'서버 요청 실패');
    const time=Math.round(d.durationSeconds/60)+'분',dist=(d.distanceMeters/1000).toFixed(1)+'km';
    const ms='● '+new Date(d.updatedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' 갱신';
    results[rkey(p,k)]={time,dist,ms};
    if(cfg.places[i]===p&&cfg.origins[k]===o&&$(`time${i}_${k}`)){put(`time${i}_${k}`,time);put(`dist${i}_${k}`,dist);const m=$(`ms${i}_${k}`);m.textContent=ms;m.style.color='#72dfa0'}
  }catch(e){const m=$(`ms${i}_${k}`);if(m){m.textContent=e.message;m.style.color='#ff8f8f'}}
}
async function calcOne(i){const b=$('calc'+i);if(b)b.disabled=true;await Promise.all([calcRoute(i,0),calcRoute(i,1)]);if($('calc'+i))$('calc'+i).disabled=false}
async function calcAll(){const b=$('refresh');b.disabled=true;await Promise.all(cfg.places.map((_,i)=>calcOne(i)));b.disabled=false}
$('refresh').onclick=calcAll;
$('addPlace').onclick=()=>openModal({title:'장소 추가',name:'',addr:'',canDelete:false,onSave:(n,a)=>{cfg.places.push({id:'p'+Date.now(),tag:'자주 가는 곳',name:n,address:a});saveCfg();renderCards();calcOne(cfg.places.length-1)}});
let modalSave=null,modalDel=null;
function openModal(o){$('mTitle').textContent=o.title;$('mName').value=o.name;$('mAddr').value=o.addr;$('mDel').style.display=o.canDelete?'':'none';modalSave=o.onSave;modalDel=o.onDelete;$('modal').classList.add('show');setTimeout(()=>$('mAddr').focus(),50)}
function closeModal(){$('modal').classList.remove('show')}
$('mCancel').onclick=closeModal;
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
$('mDel').onclick=()=>{if(confirm('이 장소를 삭제할까요?')){closeModal();modalDel&&modalDel()}};
$('sheet').addEventListener('submit',e=>{e.preventDefault();const a=$('mAddr').value.trim();if(a.length<2)return;const n=$('mName').value.trim()||a;closeModal();modalSave&&modalSave(n,a)});
renderOrigin();renderCards();
/* ---------- 광안대교 (YouTube) ---------- */
const cams=[['하부 롯데아파트','FJlxNUM-AXQ'],['하부 용호동','5-BhCOQ4f4s'],['상부 용호동','ufRTT1XhcSs'],['상부 현수중앙','OhXqC3pDBaU'],['상부','FbaiWK-0MsI']];
let currentCam=Number(localStorage.getItem('busanCam'))||0;
const player=$('player'),camName=$('camName'),camGrid=$('camGrid'),youtubeLink=$('youtubeLink');
function selectCam(i){currentCam=i;camName.textContent=cams[i][0];player.src='https://www.youtube-nocookie.com/embed/'+cams[i][1]+'?autoplay=1&mute=1&playsinline=1&rel=0';youtubeLink.href='https://www.youtube.com/watch?v='+cams[i][1];document.querySelectorAll('#camGrid .cam').forEach((b,j)=>b.classList.toggle('active',i===j));localStorage.setItem('busanCam',i)}
cams.forEach((c,i)=>{const b=document.createElement('button');b.className='cam';b.textContent=c[0];b.onclick=()=>selectCam(i);camGrid.appendChild(b)});
$('videoReload').onclick=()=>selectCam(currentCam);
currentCam=Math.min(currentCam,cams.length-1);
/* ---------- 교통 CCTV (부산시 HLS) ---------- */
const CAMS=[["좌수영교", "https://its-stream4.busan.go.kr:8443/rtplive/cctv_125.stream/playlist.m3u8"], ["수영4호교", "https://its-stream4.busan.go.kr:8443/rtplive/cctv_132.stream/playlist.m3u8"], ["센텀입구", "https://its-stream2.busan.go.kr:8443/rtplive/2026-EC-01-041.stream/playlist.m3u8"], ["과정교차로", "https://its-stream3.busan.go.kr:8443/rtplive/cctv_63.stream/playlist.m3u8"], ["토곡사거리", "https://its-stream3.busan.go.kr:8443/rtplive/cctv_62.stream/playlist.m3u8"], ["광안대교 상부 벡스코합류", "https://its-stream4.busan.go.kr:8443/rtplive/cctv_176.stream/playlist.m3u8"], ["광안대교 상부 롯데아파트", "https://its-stream4.busan.go.kr:8443/rtplive/cctv_171.stream/playlist.m3u8"], ["광안대교 하부 광안리합류", "https://its-stream4.busan.go.kr:8443/rtplive/cctv_190.stream/playlist.m3u8"], ["신선대 부산항입구", "https://its-stream5.busan.go.kr:8443/rtplive/cctv_507.stream/playlist.m3u8"], ["동명오거리", "https://its-stream3.busan.go.kr:8443/rtplive/cctv_44.stream/playlist.m3u8"], ["장산터널", "https://its-stream2.busan.go.kr:8443/rtplive/2026-EC-03-010.stream/playlist.m3u8"], ["대천램프", "https://its-stream6.busan.go.kr:8443/rtplive/cctv_2022229.stream/playlist.m3u8"], ["센텀시티역", "https://its-stream4.busan.go.kr:8443/rtplive/cctv_203.stream/playlist.m3u8"], ["벡스코 컨벤션홀1 센텀시티역", "https://its-stream5.busan.go.kr:8443/rtplive/ID-1318_.stream/playlist.m3u8"], ["올림픽교차로", "https://its-stream3.busan.go.kr:8443/rtplive/cctv_88.stream/playlist.m3u8"], ["벡스코 신관2 올림픽교차로", "https://its-stream5.busan.go.kr:8443/rtplive/ID-1319_.stream/playlist.m3u8"]];
const cv=$('cv'),cmsg=$('cmsg'),cgrid=$('cctvGrid');let curC=Number(localStorage.getItem('busanCctv'))||0,hls=null,retry=0,rt=0;
if(curC>=CAMS.length)curC=0;
function csay(t){cmsg.textContent=t||'';cmsg.hidden=!t}
function cstop(){clearTimeout(rt);if(hls){hls.destroy();hls=null}cv.removeAttribute('src');cv.load()}
function attach(){
  hls=new Hls({maxBufferLength:10,liveSyncDurationCount:3});
  hls.on(Hls.Events.MANIFEST_PARSED,()=>{csay('');cv.play().catch(()=>{})});
  hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)cfail()});
  hls.loadSource(CAMS[curC][1]);hls.attachMedia(cv);
}
function cplay(){
  cstop();retry=0;csay('영상을 불러오는 중…');
  if(window.Hls&&Hls.isSupported())attach();
  else if(cv.canPlayType('application/vnd.apple.mpegurl')){cv.src=CAMS[curC][1];cv.play().catch(()=>{})}
  else csay('이 브라우저는 실시간 영상을 재생하지 못합니다.');
}
function cfail(){
  if(retry>=3){csay('영상을 불러오지 못했습니다. 새로고침을 눌러 주세요.');return}
  retry++;csay('연결이 끊겨 다시 시도하는 중… ('+retry+'/3)');
  clearTimeout(rt);rt=setTimeout(()=>{if(hls){hls.destroy();hls=null}attach()},2500);
}
cv.addEventListener('playing',()=>csay(''));
function selectC(i){curC=i;$('cname').textContent=CAMS[i][0];document.querySelectorAll('#cctvGrid .cam').forEach((b,j)=>b.classList.toggle('active',i===j));localStorage.setItem('busanCctv',i);cplay()}
CAMS.forEach((c,i)=>{const b=document.createElement('button');b.className='cam';b.type='button';b.textContent=c[0];b.onclick=()=>selectC(i);cgrid.appendChild(b)});
$('creload').onclick=cplay;
$('cfull').onclick=()=>{const f=cv.requestFullscreen||cv.webkitRequestFullscreen||cv.webkitEnterFullscreen;if(f)f.call(cv)};
/* ---------- 탭 ---------- */
const tabInfo={commute:['🚗 출퇴근 시간','현재 교통 기준 예상시간과 거리'],bridge:['🌉 광안대교 CCTV','실시간 교통 영상 5개'],traffic:['📹 교통 CCTV','부산 주요 도로 실시간 영상']};
let activeTab='commute';
function onTab(t){
  activeTab=t;
  // 보이지 않는 탭의 영상은 멈춰서 데이터·배터리를 아낀다.
  if(t==='bridge')selectCam(currentCam);else player.src='about:blank';
  if(t==='traffic'){$('cname').textContent=CAMS[curC][0];document.querySelectorAll('#cctvGrid .cam').forEach((b,j)=>b.classList.toggle('active',curC===j));cplay()}else cstop();
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));$(b.dataset.tab+'Panel').classList.add('active');$('pageTitle').textContent=tabInfo[b.dataset.tab][0];$('pageSub').textContent=tabInfo[b.dataset.tab][1];localStorage.setItem('busanTab',b.dataset.tab);scrollTo(0,0);onTab(b.dataset.tab)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&activeTab==='traffic')cplay()});
const savedTab=localStorage.getItem('busanTab');if(savedTab&&savedTab!=='commute')document.querySelector(`.nav button[data-tab="${savedTab}"]`)?.click();
/* ---------- 설치 ---------- */
let deferredPrompt=null;const installBox=$('installBox');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBox.classList.add('show')});$('installBtn').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBox.classList.remove('show')}else alert('브라우저 메뉴에서 “홈 화면에 추가”를 눌러주세요.')};window.addEventListener('appinstalled',()=>installBox.classList.remove('show'));
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
setTimeout(calcAll,300);
</script>
